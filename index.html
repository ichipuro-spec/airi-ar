<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Airi AR ポスター（テスト版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <!-- A-Frame + MindAR（iPhoneに強い画像認識AR） -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; background: #000; }

    /* スタート画面 */
    #intro {
      position: fixed; inset: 0; z-index: 10000;
      background: radial-gradient(circle at 50% 30%, #2a0a3a 0%, #0a0212 70%);
      color: #fff; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 24px; box-sizing: border-box;
    }
    #intro h1 { font-size: 26px; margin: 0 0 6px; color: #ff45c8; text-shadow: 0 0 12px #ff45c8; }
    #intro h2 { font-size: 15px; margin: 0 0 24px; font-weight: 400; color: #8fd3ff; letter-spacing: 1px; }
    #intro ol { text-align: left; font-size: 15px; line-height: 1.9; max-width: 320px; margin: 0 0 28px; padding-left: 22px; }
    #intro .note { font-size: 12px; color: #aaa; max-width: 320px; line-height: 1.6; margin-top: 18px; }
    #startBtn {
      background: linear-gradient(90deg, #ff45c8, #8a4cff);
      color: #fff; border: none; border-radius: 999px;
      padding: 16px 48px; font-size: 18px; font-weight: 700;
      box-shadow: 0 0 24px rgba(255,69,200,.6); cursor: pointer;
    }
    #startBtn:active { transform: scale(.97); }

    /* 上部の案内バー */
    #hint {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      background: rgba(10,2,18,.78); color: #fff; text-align: center;
      padding: 10px 12px; font-size: 14px; display: none;
    }
    #hint b { color: #ff7ad9; }
  </style>
</head>
<body>

  <!-- ▼ スタート画面 -->
  <div id="intro">
    <h1>あっ！Airi だ！ AR</h1>
    <h2>MITO NO UTAHIME / テスト版</h2>
    <ol>
      <li>「スタート」を押す</li>
      <li>カメラの使用を<b>許可</b>する</li>
      <li>Airiのポスター全体を画面に映す</li>
      <li>ポスターの上にMV動画が出ます🎬</li>
    </ol>
    <button id="startBtn">スタート ▶</button>
    <div class="note">
      ※ iPhoneは <b>Safari</b>、Androidは <b>Chrome</b> で開いてください。<br>
      ※ 明るい場所で、ポスター全体がはっきり映るようにすると認識しやすいです。<br>
      ※ 音が出ます。マナーにご注意ください。
    </div>
  </div>

  <!-- ▼ 上部ヒント -->
  <div id="hint">📷 ポスター全体をカメラに映してください…</div>

  <!-- ▼ AR本体（MindAR）-->
  <a-scene
    mindar-image="imageTargetSrc: assets/targets.mind; autoStart: false; uiScanning: no; uiLoading: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.01;"
    color-space="sRGB"
    embedded
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="airi-mv"
        src="assets/airi-mv.mp4"
        preload="auto"
        loop
        crossorigin="anonymous"
        playsinline
        webkit-playsinline
        muted></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- ポスター（targets.mind の0番目）を認識したら出る動画 -->
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- 縦型(9:16)のドーム動画を、ポスターの高さいっぱい・中央に重ねる -->
      <a-video
        id="ar-video"
        src="#airi-mv"
        position="0 0 0"
        rotation="0 0 0"
        width="0.796"
        height="1.415">
      </a-video>
    </a-entity>
  </a-scene>

  <script>
    const intro   = document.getElementById('intro');
    const startBtn= document.getElementById('startBtn');
    const hint    = document.getElementById('hint');
    const video   = document.getElementById('airi-mv');
    const target  = document.getElementById('target');
    const sceneEl = document.querySelector('a-scene');

    let primed = false;
    let visible = false;

    // iOS対策：ユーザー操作中に一度 play→pause して再生をアンロック
    function primeVideo() {
      if (primed) return Promise.resolve();
      video.muted = true;
      return video.play().then(() => {
        video.pause();
        video.currentTime = 0;
        primed = true;
      }).catch(() => {});
    }

    startBtn.addEventListener('click', async () => {
      startBtn.textContent = '起動中…';
      await primeVideo();
      // MindARを開始（カメラ許可ダイアログが出ます）
      const arSystem = sceneEl.systems['mindar-image-system'];
      try {
        await arSystem.start();
      } catch (e) {
        alert('カメラを起動できませんでした。Safari/Chromeで開き、カメラを許可してください。');
        startBtn.textContent = 'スタート ▶';
        return;
      }
      intro.style.display = 'none';
      hint.style.display  = 'block';
    });

    // ポスターを認識したとき
    target.addEventListener('targetFound', () => {
      visible = true;
      hint.innerHTML = '🎬 <b>再生中！</b> ポスターから離れないでね';
      video.muted = false;
      video.play().catch(() => { video.muted = true; video.play(); });
    });

    // ポスターを見失ったとき
    target.addEventListener('targetLost', () => {
      visible = false;
      hint.innerHTML = '📷 もう一度ポスター全体を映してください…';
      video.pause();
    });

    // 画面タップでも再生（保険）
    document.addEventListener('click', () => {
      if (intro.style.display === 'none' && visible && video.paused) {
        video.muted = false; video.play();
      }
    });
  </script>
</body>
</html>
